<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Viewport: Standard setting, no "cover" needed if we aren't doing translucent -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FinTrack</title>

    <!-- PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FinTrack">
    
    <!-- iOS STATUS BAR: 'default' = White/Black based on system theme -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- ANDROID/CHROME: Dynamic Color Matching -->
    <!-- Light Mode: Matches your App's Light Header (White) -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <!-- Dark Mode: Matches your App's Dark Header (Slate-800) -->
    <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)">
    
    <!-- Icons -->
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/10434/10434252.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/10434/10434252.png">
    <link rel="manifest" href="manifest.json">

    <style>
        /* Reset */
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        
        /* IFRAME */
        iframe { width: 100%; height: 100%; border: none; display: block; }

        /* BACKGROUND MATCHING (Prevents white flashes during load) */
        @media (prefers-color-scheme: light) {
            body { background-color: #ffffff; }
        }
        @media (prefers-color-scheme: dark) {
            body { background-color: #1e293b; }
        }
    </style>
</head>
<body>
    <!-- 
       STRICT SANDBOX:
       1. allow-scripts: Lets your App run.
       2. allow-forms: Lets you submit data.
       3. allow-same-origin: Lets cookies/storage work.
       4. allow-modals: Lets alert/prompt work.
       
       MISSING (On Purpose): "allow-top-navigation"
       This forces the browser to BLOCK any attempt by Google to redirect the window.
    -->
    <iframe 
        id="app-frame"
        sandbox="allow-forms allow-scripts allow-same-origin allow-modals allow-popups"
        allow="clipboard-write"
        src="">
    </iframe>

    <script>
        // PASTE YOUR GAS WEB APP URL HERE
        const GAS_URL = "https://script.google.com/macros/s/AKfycbyr7jnhjf_HttYH56nWSNGNWBSU8jMgB5RXaH_xTdXb1YxGown2vllBpeDRyOMU_rGlmg/exec";

        // Add a timestamp to prevent Google Cache Redirects
        document.getElementById('app-frame').src = GAS_URL + "?v=" + new Date().getTime();
    </script>
</body>
</html>
